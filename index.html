<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CineMatch</title>

    <link rel="stylesheet" href="./styles/main.css">
    
</head>

<body id="onboarding">
    <section class="container">
        <h1><span class="destaque">Cine</span>Match</h1>

        <form id="formulario">
            <div class="user-container">
                <div class="nome-container input">
                    <label for="nome">Nome:</label>
                    <input type="text" id="nome" name="nome" required>
                </div>
                
                <div class="idade-container input">
                    <label for="idade">Idade:</label>
                    <input type="number" id="idade" name="idade" required>
                </div>
            </div>

            <!-- Gênero favorito -->
            <div class="generos-container">
                <h3>Escolha até 5 gêneros favoritos</h3>
                <ul class="generos-list">
                    <li class="gen">
                        <input type="checkbox" id="acao" name="generos" value="Action">
                        <label for="acao">Ação</label>
                    </li>
                    <li class="gen">
                        <input type="checkbox" id="aventura" name="generos" value="Adventure">
                        <label for="aventura">Aventura</label>
                    </li>
                    <li class="gen">
                        <input type="checkbox" id="anime" name="generos" value="Anime">
                        <label for="anime">Anime</label>
                    </li>
                    <li class="gen">
                        <input type="checkbox" id="comedia" name="generos" value="Comedy">
                        <label for="comedia">Comédia</label>
                    </li>
                    <li class="gen">
                        <input type="checkbox" id="crime" name="generos" value="Crime">
                        <label for="crime">Crime</label>
                    </li>
                    <li class="gen">
                        <input type="checkbox" id="drama" name="generos" value="Drama">
                        <label for="drama">Drama</label>
                    </li>
                    <li class="gen">
                        <input type="checkbox" id="espionagem" name="generos" value="Espionage">
                        <label for="espionagem">Espionagem</label>
                    </li>
                    <li class="gen">
                        <input type="checkbox" id="familia" name="generos" value="Family">
                        <label for="familia">Família</label>
                    </li>
                    <li class="gen">
                        <input type="checkbox" id="fantasia" name="generos" value="Fantasy">
                        <label for="fantasia">Fantasia</label>
                    </li>
                    <li class="gen">
                        <input type="checkbox" id="historia" name="generos" value="History">
                        <label for="historia">História</label>
                    </li>
                    <li class="gen">
                        <input type="checkbox" id="terror" name="generos" value="Horror">
                        <label for="terror">Terror</label>
                    </li>
                    <li class="gen">
                        <input type="checkbox" id="juridico" name="generos" value="Legal">
                        <label for="juridico">Jurídico</label>
                    </li>
                    <li class="gen">
                        <input type="checkbox" id="medico" name="generos" value="Medical">
                        <label for="medico">Médico</label>
                    </li>
                    <li class="gen">
                        <input type="checkbox" id="musica" name="generos" value="Music">
                        <label for="musica">Música</label>
                    </li>
                    <li class="gen">
                        <input type="checkbox" id="misterio" name="generos" value="Mystery">
                        <label for="misterio">Mistério</label>
                    </li>
                    <li class="gen">
                        <input type="checkbox" id="romance" name="generos" value="Romance">
                        <label for="romance">Romance</label>
                    </li>
                    <li class="gen">
                        <input type="checkbox" id="ficcao" name="generos" value="Science-Fiction">
                        <label for="ficcao">Ficção Científica</label>
                    </li>
                    <li class="gen">
                        <input type="checkbox" id="esportes" name="generos" value="Sports">
                        <label for="esportes">Esportes</label>
                    </li>
                    <li class="gen">
                        <input type="checkbox" id="sobrenatural" name="generos" value="Supernatural">
                        <label for="sobrenatural">Sobrenatural</label>
                    </li>
                    <li class="gen">
                        <input type="checkbox" id="suspense" name="generos" value="Thriller">
                        <label for="suspense">Suspense</label>
                    </li>
                    <li class="gen">
                        <input type="checkbox" id="guerra" name="generos" value="War">
                        <label for="guerra">Guerra</label>
                    </li>
                    <li class="gen">
                        <input type="checkbox" id="faroeste" name="generos" value="Western">
                        <label for="faroeste">Faroeste</label>
                    </li>
                </ul>
            </div>

            <button type="submit" id="submit-btn">Enviar</button>

        </form>

    </section>
        
</body>

</html>
