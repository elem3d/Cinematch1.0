<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CineMatch</title>
</head>

<body>

    <h1>CineMatch</h1>

    <form>

        <!-- Nome -->
        <label for="nome">Nome:</label>
        <input type="text" id="nome" name="nome">

        <br><br>

        <!-- Idade -->
        <label for="idade">Idade:</label>
        <input type="number" id="idade" name="idade">

        <br><br>

        <!-- Gênero favorito -->
        <label for="genero">Gênero favorito:</label>
        <select id="genero" name="genero">

            <option value="">Selecione um gênero</option>
            <option value="acao">Ação</option>
            <option value="comedia">Comédia</option>
            <option value="drama">Drama</option>
            <option value="ficcao">Ficção</option>
            <option value="terror">Terror</option>
            <option value="romance">Romance</option>

        </select>

        <br><br>

        <button type="submit">Enviar</button>

    </form>

</body>

</html>
<h2>Catálogo de Séries</h2>

<!-- Busca -->
<input 
    type="search" 
    id="busca"
    placeholder="Buscar série..."
>

<!-- Filtro -->
<label for="filtroGenero">Filtrar por gênero:</label>

<select id="filtroGenero">
    <option value="todos">Todos</option>
    <option value="Drama">Drama</option>
    <option value="Comédia">Comédia</option>
    <option value="Ação">Ação</option>
    <option value="Terror">Terror</option>
    <option value="Romance">Romance</option>
</select>

<!-- Ordenação -->
<label for="ordenacao">Ordenar por:</label>

<select id="ordenacao">
    <option value="padrao">Padrão</option>
    <option value="az">Nome: A-Z</option>
    <option value="za">Nome: Z-A</option>
    <option value="notaMaior">Nota: maior para menor</option>
    <option value="notaMenor">Nota: menor para maior</option>
</select>

<!-- Catálogo -->
<section id="catalogo">
    <!-- As séries da API aparecerão aqui -->
</section>
